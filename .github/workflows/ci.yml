name: Code Verification (CI)

# Step 1: When should it run?
on: [push, pull_request]

# Step 2: Which runner do we use and what steps do we execute?
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Clones the repository code into the virtual machine
      - name: Checkout repository code
        uses: actions/checkout@v4

      # Installs the GCC compiler on the cloud Linux runner
      - name: Install GCC
        run: sudo apt-get update && sudo apt-get install -y gcc

      # Compiles the program
      - name: Compile the code
        run: gcc c-bye/bye.c -o bye

      # Rularea programului pentru a verifica output-ul
      - name: Run and test the code
        run: ./bye

      # Salveaza executabilul pentru a putea fi descarcat din interfata GitHub
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: executabil-bye
          path: bye
